name: long_term_memory
description: >-
  A portable, dependency-light long-term memory engine for LLM applications
  (ENGRAM v2). Bring your own LLM, embedding model and database: the package
  contains the full memory-trace algorithm (forgetting curve with spacing,
  strength-based forgetting, MMR retrieval, citation and dream-phase
  consolidation), while every external capability is injected through small
  abstract interfaces.
version: 1.0.0
repository: https://github.com/CubeEarthWorld/long-term-memory

environment:
  sdk: ^3.4.0

dependencies: {}


dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
